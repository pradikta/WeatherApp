# Local observability stack: the API exports OTLP to the collector, which fans out to Jaeger (traces),
# Prometheus (metrics), and Loki (logs). Grafana ties them together. For local development only; there is
# no real authentication and no persistence.
#
#   docker compose -f observability/docker-compose.yml up -d
#   Grafana UI:     http://localhost:3001  (logs, traces, metrics; no login)
#   Jaeger UI:      http://localhost:16686
#   Prometheus UI:  http://localhost:9090
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (default protocol of the .NET OpenTelemetry exporter)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
      - loki

  loki:
    image: grafana/loki:3.6.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100" # HTTP API (no UI; use Grafana)

  grafana:
    image: grafana/grafana-oss:12.1.0
    environment:
      # Local only: anonymous admin access so no login is needed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3001:3000" # UI (host port 3001 to avoid clashing with other local apps on 3000)
    depends_on:
      - loki
      - jaeger
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.9.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # UI
    depends_on:
      - otel-collector
